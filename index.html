<script>

const ABIERTOS_EDIT = ["En cola","En análisis","En espera de información"];   // estados de la cola del encargado
const CERRADOS = ["Completado","Rechazado","Cancelado"];
const ESTADOS = ["Revisión manager", "Pendiente aprobación", ...ABIERTOS_EDIT, ...CERRADOS];

const PRIORIDADES = ["Baja","Media","Alta","Urgente"];

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoy = () => ymd(new Date());
const sumarDias = (s, n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const dia = s => s ? String(s).slice(0,10) : null;          // fecha (YYYY-MM-DD) de un timestamp
const fFecha = s => { if(!s) return "—"; const d = new Date(String(s).length===10 ? s+"T12:00:00" : s);
  return d.toLocaleDateString("es-CR",{day:"2-digit",month:"short",year:"numeric"}); };
const fFechaHora = s => s ? new Date(s).toLocaleString("es-CR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "—";
const fNum = (n, dec=2) => n==null || n==="" || isNaN(n) ? "—" : Number(n).toLocaleString("es-CR",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fHoras = h => { if(h==null || h==="") return "—"; const t = Math.round(Number(h)*60); const H = Math.floor(t/60), M = t%60; return M ? `${H} h ${M} min` : `${H} h`; };
const diasEntre = (a, b) => Math.round((new Date(dia(b)+"T12:00:00") - new Date(dia(a)+"T12:00:00")) / 864e5);
const hace = s => { const d = diasEntre(s, hoy()); return d<=0 ? "hoy" : d===1 ? "ayer" : `hace ${d} días`; };
const esCerrado = t => !!t.cerrado_at || CERRADOS.includes(t.estado);
const lower = s => (s||"").trim().toLowerCase();
const nombreDe = email => { if(!email) return "—"; const u = S.usuarios.find(x => lower(x.email)===lower(email)); return u ? (u.nombre || u.email) : email; };
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const mesKey = s => dia(s).slice(0,7);
const mesLbl = k => `${MESES[+k.slice(5,7)-1]} ${k.slice(2,4)}`;
function lunesDe(s){ const d = new Date(dia(s)+"T12:00:00"); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); }
const renderTpl = (str, v) => String(str||"").replace(/\{(\w+)\}/g, (m,k) => v[k]!=null ? String(v[k]) : m);
const clavegen = () => { const a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789"; let s=""; for(let i=0;i<10;i++) s+=a[Math.floor(Math.random()*a.length)]; return s+"!"+Math.floor(Math.random()*90+10); };

function toast(msg, err=false){
  $$(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast"+(err?" err":""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3000);
}
function fallo(e){ console.error(e); toast(e?.message || String(e), true); }

function alertaDe(t){
  if(esCerrado(t)) return null;
  const h = hoy(), a = S.cfg.app;
  if(enCola(t)){
    if(!t.fecha_eta) return "Sin estimado";
    if(t.fecha_eta < h) return "Atrasada";
    if(t.fecha_eta <= sumarDias(h, +a.dias_alerta||3)) return "Por vencer";
  }
  if(t.aprob_estado==="Pendiente" && t.aprob_enviado_at && (Date.now()-new Date(t.aprob_enviado_at)) > (+a.dias_aprob_demora||2)*864e5) return "Aprobación demorada";
  return null;
}

function campoInput(c, val, pre){
  const id = `${pre}_${c.id}`, req = c.obligatorio ? "required" : "", v = val ?? "";
  let input;
  if(c.tipo==="parrafo") input = `<textarea id="${id}" rows="3" ${req}>${esc(v)}</textarea>`;
  else if(c.tipo==="numero") input = `<input type="number" step="any" id="${id}" value="${esc(v)}" ${req}>`;
  else if(c.tipo==="fecha") input = `<input type="date" id="${id}" value="${esc(v)}" ${req}>`;
  else if(c.tipo==="lista") input = `<select id="${id}" ${req}><option value="">— Selecciona —</option>${(c.opciones||[]).map(o => `<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(c.tipo==="si_no") input = `<select id="${id}" ${req}><option value="">— Selecciona —</option>${["Sí","No"].map(o => `<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
  else input = `<input type="text" id="${id}" value="${esc(v)}" ${req}>`;
  return `<label class="f ${c.tipo==="parrafo"?"full":""}">${esc(c.etiqueta)}${c.obligatorio?" *":""}${input}</label>`;
}
const camposHTML = (tipo, datos, pre) => camposDe(tipo).map(c => campoInput(c, (datos||{})[c.id], pre)).join("");
function leerCampos(tipo, pre, base={}){
  const d = {...base};
  for(const c of camposDe(tipo)){ const el = $(`#${pre}_${c.id}`); if(!el) continue; const v = el.value.trim();
    if(c.obligatorio && !v) throw new Error(`Completa el campo "${c.etiqueta}"`); if(v) d[c.id] = v; else delete d[c.id]; }
  return d;
}
function detalleKV(t){
  const fila = (l, v) => `<dt>${esc(l)}</dt><dd style="white-space:pre-wrap">${esc(v)}</dd>`;
  let h = camposDe(t.tipo).filter(c => (t.datos||{})[c.id]).map(c => fila(c.etiqueta, t.datos[c.id])).join("");
  // Datos de solicitudes creadas antes del formulario configurable
  if(t.cliente) h += fila("Cliente", t.cliente);
  if(t.monto_impacto!=null) h += fila("Monto de impacto", fNum(t.monto_impacto)+" "+(t.moneda||""));
  if(t.descuento_pct!=null) h += fila("Descuento", fNum(t.descuento_pct)+" %");
  return h;
}

let iniciando = false;
async function iniciar(){
  if(iniciando) return; iniciando = true;
  if(DEMO) Demo.init();
  try{
    S.user = await API.sesion();
    if(!S.user) return pintarLogin();
    S.me = await API.me(S.user.id);
    if(!S.me || !S.me.activo) return pintarSinAcceso();
    S.me.email = lower(S.me.email);
    if(S.me.rol!=="solicitante" && await API.pinPendiente()) return pintarCambioPin(true);
    await recargar();
    S.tab = tabsRol()[0][0];
    if(misAprobaciones().length && tabsRol().some(x=>x[0]==="aprobaciones")) S.tab = "aprobaciones";
    if(misRevisiones().length && tabsRol().some(x=>x[0]==="revision")) S.tab = "revision";
    pintarApp();
    if(S.abrir){
      const t = S.tickets.find(x => x.codigo===S.abrir || String(x.id)===S.abrir);
      S.abrir = null; history.replaceState(null, "", location.pathname);
      if(t) abrirDetalle(t.id); else toast("No tienes acceso a ese ticket o no existe", true);
    }
  }catch(e){ fallo(e); pintarLogin(); }
  finally{ iniciando = false; }
}
async function recargar(){
  const [u, cfg] = await Promise.all([API.usuarios(), API.config()]);
  S.usuarios = u || [];
  S.cfg = structuredClone(CFG_DEFAULT);
  for(const k in cfg){ S.cfg[k] = (cfg[k] && typeof cfg[k]==="object" && !Array.isArray(cfg[k])) ? {...(CFG_DEFAULT[k]||{}), ...cfg[k]} : cfg[k]; }
  S.cfg.plantillas = {...CFG_DEFAULT.plantillas, ...(cfg.plantillas||{})};
  if(!S.cfg.formulario || !Array.isArray(S.cfg.formulario.tipos) || !S.cfg.formulario.tipos.length) S.cfg.formulario = structuredClone(CFG_DEFAULT.formulario);
  TIPOS = S.cfg.formulario.tipos.map(x => x.nombre);
  const [t, cola, n, h] = await Promise.all([API.tickets(), API.miCola(), API.notifs(), API.horas()]);
  S.tickets = t || []; S.tickets.forEach(x => { if(x.tipo && !TIPOS.includes(x.tipo)) TIPOS.push(x.tipo); }); S.cola = cola || []; S.notifs = n || []; S.horas = h || [];
}

const pinInput = (id, ph="•••••") => `<input type="password" id="${id}" inputmode="numeric" autocomplete="off" maxlength="8" required
  style="font-size:24px;letter-spacing:8px;text-align:center;font-weight:800" placeholder="${ph}">`;
function soloDigitos(el){ el.oninput = () => { el.value = el.value.replace(/\D/g,""); }; }
function pinError(p){   // mismas reglas que la base de datos
  if(!/^\d{5,8}$/.test(p)) return "El PIN debe tener de 5 a 8 dígitos";
  if(p==="00000") return "Elige un PIN distinto al inicial";
  if(/^(\d)\1*$/.test(p)) return "El PIN no puede tener todos los dígitos iguales";
  const d = [...p].map(Number);
  if(d.every((x,i) => i===0 || (x - d[i-1] + 10)%10===1) || d.every((x,i) => i===0 || (d[i-1] - x + 10)%10===1)) return "El PIN no puede ser una secuencia como 12345";
  return null;
}

    <p class="muted small" style="margin-top:0">${obligatorio ? "Es tu primer ingreso o el administrador restableció tu PIN. Elige uno nuevo para continuar." : "Usarás este PIN cada vez que ingreses."}</p>

      <label class="f">Repite el PIN nuevo${pinInput("pc")}</label>
      <div class="hint">No se permiten 00000, dígitos repetidos (77777) ni secuencias (12345).</div>
      <button class="btn pri" type="submit" id="bp">Guardar PIN</button>

  else modal(`<div class="modal-h"><div></div><button class="x">×</button></div>${form}`, "narrow");
  $$("#fp input").forEach(soloDigitos); ($("#pa") || $("#pn")).focus();
  $("#psalir") && ($("#psalir").onclick = async () => { await API.salir(); S.me = null; S.user = null; pintarLogin(); });
  $("#pcancel") && ($("#pcancel").onclick = cerrarModal);
  $("#fp").onsubmit = async e => {
    e.preventDefault();
    const actual = conocido ? S.pinIngresado : $("#pa").value, nuevo = $("#pn").value;
    if(nuevo !== $("#pc").value) return toast("Los PIN nuevos no coinciden", true);
    const err = pinError(nuevo); if(err) return toast(err, true);
    try{

      if(obligatorio){ S.me = null; iniciar(); } else cerrarModal();
    }catch(e2){ fallo(e2); }
  };
}

function tabsRol(){
  const T = {inicio:["inicio", rol()==="manager" ? "Cola" : "Inicio"], tickets:["tickets","Tickets"], analitica:["analitica","Analítica"],
    horas:["horas","Horas"], aprob:["aprobaciones","Aprobaciones", misAprobaciones().length], mis:["mis","Mis solicitudes"],
    rev:["revision","Revisión", misRevisiones().length],
    usuarios:["usuarios","Usuarios"], config:["config","Configuración"]};
  const conAprob = l => misAprobaciones().length && !l.includes(T.aprob) ? [...l, T.aprob] : l;
  switch(rol()){
    case "solicitante": return conAprob([T.mis]);
    case "aprobador":   return [T.aprob, T.mis];
    case "encargado":   return conAprob([T.inicio, T.tickets, T.mis]);
    case "manager":     return conAprob([T.rev, T.analitica, T.inicio, T.tickets, T.horas, T.mis]);
    default:            return [T.inicio, T.rev, T.tickets, T.analitica, T.horas, T.aprob, T.mis, T.usuarios, T.config];
  }
}

/* =====================================================================
   Mis solicitudes (vista del solicitante)
   ===================================================================== */
function pasos(t){
  const ap = t.requiere_aprobacion, apL = S.cfg.aprobacion.cargo || "Aprobación";
  const L = ["Recibida", ...(t.manager_estado && t.manager_estado!=="No aplica" ? ["Manager"] : []), ...(ap?[apL]:[]), "En cola", "En análisis", "Cerrada"];
  let i, warn = false;
  if(esCerrado(t)) i = L.length-1;
  else if(t.estado==="Revisión manager"){ i = L.indexOf("Manager"); warn = true; }
  else if(t.estado==="Pendiente aprobación"){ i = L.indexOf(apL); warn = true; }
  else if(t.estado==="En espera de información"){ i = L.indexOf("En análisis"); warn = true; }
  else if(t.estado==="En análisis") i = L.indexOf("En análisis");
  else i = L.indexOf("En cola");
  return `<div class="steps">${L.map((l,k) => `<div class="step ${k<i||esCerrado(t)?"done":k===i?"now"+(warn?" warn":""):""}"><div class="c"></div>${esc(l)}</div>`).join("")}</div>`;
}
function pista(c){
  const adelante = c.adelante, MAX = 10; let html = "";
  const dotsAntes = Math.min(adelante, MAX);
  for(let i=0;i<dotsAntes;i++) html += `<span class="dot ${i===0?"work":""}" title="${i===0?"En atención":"Solicitud antes de la tuya"}"></span>`;
  if(adelante > MAX) html += `<span class="dots-more">+${adelante-MAX}</span>`;
  html += `<span class="dot me" title="Tu solicitud">Tú</span>`;
  const despues = Math.min(c.total - c.posicion, 4);
  for(let i=0;i<despues;i++) html += `<span class="dot after"></span>`;
  return `<div class="track">${html}</div>`;
}
function vMis(){
  const mias = S.tickets.filter(esMio);
  const abiertas = mias.filter(t => !esCerrado(t)).sort((a,b) => (a.orden??1e9)-(b.orden??1e9));

  const card = t => {
    const c = S.cola.find(x => x.ticket_id===t.id);
    let pos;
    if(t.estado==="Revisión manager") pos = `<div class="posbox wait"><div class="big">En revisión</div><div class="of">Con ${esc(nombreDe(t.manager_email))}</div></div>`;

    else if(c) pos = `<div class="posbox"><div class="big">#${c.posicion}</div><div class="of">en la cola de ${c.total}</div></div>`;
    else pos = `<div class="posbox"><div class="big">—</div><div class="of">Calculando posición</div></div>`;
    let msg = "";
    if(t.estado==="En espera de información") msg = `<div class="banner" style="margin:0 0 8px">El equipo de Pricing necesita información. Abre el ticket y responde en los comentarios.</div>`;
    else if(t.estado==="Revisión manager") msg = `<div class="small" style="margin-bottom:6px">El manager revisa tu solicitud. Cuando la apruebe pasa a la cola de Pricing${S.cfg.aprobacion.email?` o, si lo requiere, a ${esc(aprobTitulo())}`:""}.</div>`;
    else if(t.estado==="Pendiente aprobación") msg = `<div class="small" style="margin-bottom:6px">Tu solicitud está en <b>${esc(aprobTitulo())}</b>. Al aprobarse pasa a la cola de Pricing.</div>`;
    else if(c) msg = `<div class="b" style="margin-bottom:2px">${c.adelante===0 ? (t.estado==="En análisis" ? "¡Tu solicitud se está atendiendo!" : "¡Tu solicitud es la siguiente!") : `Hay ${c.adelante} solicitud${c.adelante>1?"es":""} antes de la tuya`}</div>${pista(c)}`;
    return `<div class="mcard">
      <div class="hdr" data-open="${t.id}"><div class="grow">

        <div class="b" style="margin-top:4px">${esc(t.titulo)}</div>
        <div class="sub">${esc(tipoTxt(t))} · enviada ${hace(t.created_at)}${t.fecha_eta?` · fecha estimada <b>${fFecha(t.fecha_eta)}</b>`:(enCola(t)?" · Pricing aún no define la fecha estimada":"")}</div></div>
        <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm ghost" data-cancel="${t.id}" style="color:var(--brick)">Cancelar</button><span class="btn sm">Ver detalle</span></div></div>
      <div class="body">${pos}<div>${msg}${pasos(t)}</div></div></div>`;
  };
  $("#main").innerHTML = `
    <div class="page-h"><div class="grow"><h1>Mis solicitudes</h1><p class="muted small">Sigue el avance de tus solicitudes y tu lugar en la cola de Pricing.</p></div>
      <button class="btn pri" id="mis-nueva">+ Nueva solicitud</button></div>
    ${abiertas.length ? `<div class="mine">${abiertas.map(card).join("")}</div>`
      : `<div class="card empty">No tienes solicitudes abiertas. <a href="#" id="mis-nueva2">Crear una</a></div>`}
    <h2 style="margin-top:24px">Cerradas</h2>
    ${cerradas.length ? `<div class="tbl-wrap"><table><thead><tr><th>Ticket</th><th>Solicitud</th><th>Resultado</th><th>Resolución</th><th>Cerrada</th><th class="r">Días</th></tr></thead>
      <tbody>${cerradas.map(t => `<tr class="click" data-open="${t.id}"><td class="code">${esc(t.codigo)}</td><td><div class="b">${esc(t.titulo)}</div><div class="sub">${esc(tipoTxt(t))}</div></td>
        <td>${tagEstado(t.estado)}</td><td class="small" style="max-width:380px">${esc(t.resolucion||"—")}</td><td class="small num">${fFecha(t.cerrado_at)}</td><td class="r num">${diasEntre(t.created_at, t.cerrado_at)}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="muted small">Aún no tienes solicitudes cerradas.</div>`}`;
  $$("[data-open]").forEach(el => el.onclick = () => abrirDetalle(+el.dataset.open));
  $$("[data-cancel]").forEach(b => b.onclick = async ev => { ev.stopPropagation(); const t = S.tickets.find(x => x.id===+b.dataset.cancel);
    const m = prompt(`¿Cancelar ${t.codigo}? Puedes indicar el motivo (opcional):`, ""); if(m===null) return;
    try{ await conBoton(b, () => API.cancelar(t.id, m)); toast(`${t.codigo} cancelada`); await refrescar(); }catch(e){ fallo(e); } });
  $("#mis-nueva").onclick = abrirNuevo; $("#mis-nueva2") && ($("#mis-nueva2").onclick = e => { e.preventDefault(); abrirNuevo(); });
}

/* =====================================================================

function vInicio(){
  const T = S.tickets, ab = T.filter(enCola), h = hoy(), lunes = lunesDe(h);
  const misAb = ab.filter(t => lower(t.asignado_email)===S.me.email);
  const base = rol()==="encargado" && misAb.length ? misAb : ab;
  const horasSem = S.horas.filter(x => dia(x.fecha) >= lunes && (rol()!=="encargado" || lower(x.usuario_email)===S.me.email)).reduce((s,x)=>s+Number(x.horas),0);
  const k = [
    ["Pendientes", base.length, "k-green", {vista:"abiertos"}],
    ["Ingresados hoy", T.filter(t => dia(t.created_at)===h).length, "k-slate", {vista:"todos", desde:h, hasta:h}],
    ["Prioridad alta o urgente", base.filter(t => ["Alta","Urgente"].includes(t.prioridad)).length, "k-olive", {vista:"abiertos", prioridad:"altas"}],
    ["Atrasadas (según ETA)", base.filter(t => alertaDe(t)==="Atrasada").length, "k-brick", {vista:"abiertos", alerta:"Atrasada"}],
    ["Por vencer (ETA)", base.filter(t => alertaDe(t)==="Por vencer").length, "k-olive", {vista:"abiertos", alerta:"Por vencer"}],
    ["Sin fecha estimada", base.filter(t => alertaDe(t)==="Sin estimado").length, "k-slate", {vista:"abiertos", alerta:"Sin estimado"}],
    ["En revisión del manager", T.filter(t => t.estado==="Revisión manager").length, "k-slate", {vista:"Revisión manager", asignado:""}],
    [`En ${aprobTitulo()}`, T.filter(t => t.estado==="Pendiente aprobación").length, "k-slate", {vista:"Pendiente aprobación", asignado:""}],
    ["Esperando información", base.filter(t => t.estado==="En espera de información").length, "k-slate", {vista:"En espera de información"}],
    ["Cerrados esta semana", T.filter(t => t.cerrado_at && dia(t.cerrado_at) >= lunes).length, "k-green", {vista:"cerrados", desde:lunes}],
    ["Horas esta semana", fNum(horasSem,1), "k-slate", null]

  let lista = colaGlobal(); if(S.soloMios) lista = lista.filter(t => lower(t.asignado_email)===S.me.email);

    <div class="page-h" style="margin-top:22px;margin-bottom:10px"><div class="grow"><h2 style="margin:0">Cola de atención</h2>
      <p class="hint">Arrastra desde ⠿ (o usa ▲ ▼) para cambiar el orden en que se atienden. El #1 es el siguiente.</p></div>
      <label class="check small"><input type="checkbox" id="solomios" ${S.soloMios?"checked":""}> Solo asignados a mí</label></div>
    ${lista.length ? `<div class="queue" id="queue">${lista.map(t => `<div class="qi ${pos.get(t.id)===1?"first":""}" data-id="${t.id}">

    if(j<0 || j>=ids.length) return; [ids[i], ids[j]] = [ids[j], ids[i]]; await guardarOrden(ids); };

    onEnd: () => guardarOrden($$("#queue .qi").map(x => +x.dataset.id))});

async function guardarOrden(idsVisibles){
  // Si la lista está filtrada, se reacomodan solo esas posiciones dentro de la cola completa
  const global = colaGlobal().map(t => t.id), set = new Set(idsVisibles); let k = 0;
  const nuevo = global.map(id => set.has(id) ? idsVisibles[k++] : id);
  nuevo.forEach((id,i) => { const t = S.tickets.find(x => x.id===id); if(t) t.orden = i+1; });
  vInicio();
  try{ await API.reordenar(nuevo); }catch(e){ fallo(e); refrescar(); }
}

function filtrar(){
  const f = S.f, q = lower(f.q);
  return S.tickets.filter(t => {
    const c = esCerrado(t);
    if(f.vista==="abiertos" && c) return false;
    if(f.vista==="cerrados" && !c) return false;
    if(!["abiertos","cerrados","todos"].includes(f.vista) && t.estado!==f.vista) return false;
    if(q && !lower([t.codigo,t.titulo,t.cliente,t.descripcion,t.linea_producto,t.solicitante_email,nombreDe(t.solicitante_email)].join(" ")).includes(q)) return false;
    if(f.tipo && t.tipo!==f.tipo) return false;
    if(f.prioridad==="altas" && !["Alta","Urgente"].includes(t.prioridad)) return false;
    if(f.prioridad && f.prioridad!=="altas" && t.prioridad!==f.prioridad) return false;
    if(f.asignado==="yo" && lower(t.asignado_email)!==S.me.email) return false;
    if(f.asignado==="sin" && t.asignado_email) return false;
    if(f.asignado && !["yo","sin"].includes(f.asignado) && lower(t.asignado_email)!==f.asignado) return false;
    if(f.solicitante && lower(t.solicitante_email)!==f.solicitante) return false;
    const fd = f.vista==="cerrados" ? dia(t.cerrado_at) : dia(t.created_at);
    if(f.desde && fd < f.desde) return false;
    if(f.hasta && fd > f.hasta) return false;
    const a = alertaDe(t);
    if(f.alerta==="cualquiera" && !a) return false;
    if(f.alerta && f.alerta!=="cualquiera" && a!==f.alerta) return false;
    return true;
  });
}

function filaReporte(t){

function exportarCSV(filas, nombre){
  if(!filas.length) return toast("No hay filas para exportar", true);
  const cols = Object.keys(filas[0]);
  const q = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const csv = "\ufeff" + [cols.join(";"), ...filas.map(x => cols.map(c => q(x[c])).join(";"))].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* =====================================================================
   Gráficos (SVG, paleta Legrand)
   ===================================================================== */
const COL = {green:"var(--green)", olive:"var(--olive)", slate:"var(--slate)", brick:"var(--brick)"};
function niceMax(v){ if(v<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function columnas({labels, series, fmt = v => fNum(v,0), alto = 220, etiquetas = true}){
  const W = 640, H = alto, padL = 36, padB = 26, padT = 18, n = labels.length, k = series.length;
  const max = niceMax(Math.max(0, ...series.flatMap(s => s.values)));
  const gw = (W - padL) / Math.max(n,1), bw = Math.min(26, (gw*0.7) / k), gap = 2;
  const y = v => padT + (H - padT - padB) * (1 - v/max);
  let g = "";
  for(let i=0;i<=4;i++){ const v = max*i/4, yy = y(v); g += `<line class="gl" x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}"/><text class="ax" x="${padL-6}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`; }
  labels.forEach((l,i) => {
    const cx = padL + gw*i + gw/2, x0 = cx - (bw*k + gap*(k-1))/2;
    let col = `<g class="col"><title>${esc(l)}\n${series.map(s => `${s.name}: ${fmt(s.values[i])}`).join("\n")}</title><rect class="hit" x="${padL+gw*i}" y="${padT}" width="${gw}" height="${H-padT-padB}"/>`;
    series.forEach((s,j) => { const v = s.values[i]||0, x = x0 + j*(bw+gap), yy = y(v), h = (H-padB) - yy, r = Math.min(4, h, bw/2);
      if(h > 0) col += `<path class="bar" fill="${s.color}" d="M${x},${H-padB} L${x},${yy+r} Q${x},${yy} ${x+r},${yy} L${x+bw-r},${yy} Q${x+bw},${yy} ${x+bw},${yy+r} L${x+bw},${H-padB} Z"/>`;
      if(etiquetas && v>0 && n<=12) col += `<text class="vl" x="${x+bw/2}" y="${yy-5}" text-anchor="middle">${fmt(v)}</text>`; });
    col += `<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${esc(l)}</text></g>`;
    g += col;
  });
  const ley = k > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="chart">${ley}<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}
function barras(rows, fmt = v => fNum(v,0), color = COL.green){
  if(!rows.length) return `<div class="muted small">Sin datos en el período</div>`;
  const max = Math.max(...rows.map(r => r[1]), 1);
  return `<div class="bars">${rows.map(([l,v,extra]) => `<div class="bar" title="${esc(l)}: ${fmt(v)}"><span class="lbl">${esc(l)}</span><span class="val num">${fmt(v)}${extra?` <span class="muted" style="font-weight:500">${extra}</span>`:""}</span><div class="trk"><div class="fil" style="width:${v/max*100}%;background:${color}"></div></div></div>`).join("")}</div>`;
}
function rangoDesde(r){ const d = new Date(); if(r==="ano") return `${d.getFullYear()}-01-01`; d.setMonth(d.getMonth() - (+r) + 1); d.setDate(1); return ymd(d); }
function mesesDesde(desde){ const out = []; const d = new Date(desde+"T12:00:00"); d.setDate(1); const fin = hoy().slice(0,7);
  while(ymd(d).slice(0,7) <= fin){ out.push(ymd(d).slice(0,7)); d.setMonth(d.getMonth()+1); } return out; }

/* =====================================================================
   Registro de horas
   ===================================================================== */
function vHoras(){
  const desde = rangoDesde(S.hr.rango), tk = new Map(S.tickets.map(t => [t.id,t]));
  const hr = S.horas.filter(x => dia(x.fecha) >= desde && (!S.hr.quien || lower(x.usuario_email)===S.hr.quien)).sort((a,b) => b.fecha.localeCompare(a.fecha));
  const quienes = [...new Set(S.horas.map(x => lower(x.usuario_email)))];
  const semanas = []; let d = lunesDe(desde); const fin = lunesDe(hoy());
  while(d <= fin){ semanas.push(d); d = sumarDias(d, 7); }
  const sSem = semanas.map(w => hr.filter(x => lunesDe(x.fecha)===w).reduce((s,x)=>s+Number(x.horas),0));
  const porQuien = quienes.map(q => [nombreDe(q), hr.filter(x=>lower(x.usuario_email)===q).reduce((s,x)=>s+Number(x.horas),0)]).filter(r=>r[1]).sort((a,b)=>b[1]-a[1]);
  const total = hr.reduce((s,x)=>s+Number(x.horas),0), nT = new Set(hr.map(x=>x.ticket_id)).size;
  const lbls = semanas.map(w => { const dd = new Date(w+"T12:00:00"); return `${dd.getDate()} ${MESES[dd.getMonth()]}`; });
  $("#main").innerHTML = `
    <div class="page-h"><div class="grow"><h1>Registro de horas</h1><p class="muted small">Tiempo de ejecución que registra Pricing al cerrar cada ticket.</p></div>
      <select id="hq" style="width:auto"><option value="">Todo el equipo</option>${quienes.map(q=>`<option value="${esc(q)}" ${S.hr.quien===q?"selected":""}>${esc(nombreDe(q))}</option>`).join("")}</select>
      <div class="seg" id="hrg">${[["1","Este mes"],["3","3 meses"],["6","6 meses"],["12","12 meses"]].map(([k,l]) => `<button data-r="${k}" class="${S.hr.rango===k?"on":""}">${l}</button>`).join("")}</div>
      <button class="btn sm" id="hcsv">Exportar CSV</button></div>
    <div class="grid kpis">
      <div class="kpi k-green"><div class="v num">${fNum(total,1)}</div><div class="l">Horas en el período</div></div>
      <div class="kpi k-slate"><div class="v num">${nT}</div><div class="l">Tickets con horas</div></div>
      <div class="kpi k-slate"><div class="v num">${nT?fNum(total/nT,1):"—"}</div><div class="l">Horas promedio por ticket</div></div>
      <div class="kpi k-olive"><div class="v num">${semanas.length?fNum(total/semanas.length,1):"—"}</div><div class="l">Horas promedio por semana</div></div>
    </div>
    <div class="grid two" style="margin-top:14px">
      <div class="card"><h2>Horas por semana</h2>${columnas({labels:lbls, series:[{name:"Horas", color:COL.green, values:sSem}], fmt:v=>fNum(v,0), etiquetas:semanas.length<=14})}</div>
      <div class="card"><h2>Horas por persona</h2>${barras(porQuien, v=>fNum(v,1)+" h")}</div>
    </div>
    <h2 style="margin-top:18px">Detalle</h2>
    ${hr.length ? `<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Ticket</th><th>Tipo</th><th>Registrado por</th><th>Nota</th><th class="r">Horas</th></tr></thead>
      <tbody>${hr.slice(0,300).map(x => { const t = tk.get(x.ticket_id); return `<tr class="click" data-open="${x.ticket_id}"><td class="small num">${fFecha(x.fecha)}</td>
        <td><span class="code">${esc(t?.codigo||"")}</span> <span class="small">${esc(t?.titulo||"")}</span></td><td class="small">${esc(t?.tipo||"")}</td>
        <td class="small">${esc(nombreDe(x.usuario_email))}</td><td class="small">${esc(x.nota||"")}</td><td class="r num b">${fHoras(x.horas)}</td></tr>`; }).join("")}</tbody></table></div>`
      : `<div class="card empty">Sin horas registradas en el período.</div>`}`;
  $$("#hrg button").forEach(b => b.onclick = () => { S.hr.rango = b.dataset.r; vHoras(); });
  $("#hq").onchange = e => { S.hr.quien = e.target.value; vHoras(); };
  $$("[data-open]").forEach(el => el.onclick = () => abrirDetalle(+el.dataset.open));
  $("#hcsv").onclick = () => exportarCSV(hr.map(x => { const t = tk.get(x.ticket_id); return {fecha:dia(x.fecha), numero:t?.codigo||"", tipo_solicitud:t?.tipo||"", titulo:t?.titulo||"", cliente:t?.cliente||"", registrado_por:x.usuario_email, nota:x.nota||"", horas:x.horas}; }), `horas_pricing_${hoy()}.csv`);
}

  $$("[data-open]").forEach(el => el.onclick = () => abrirDetalle(+el.dataset.open));
  $$("[data-rok]").forEach(b => b.onclick = () => revisarTicket(b, +b.dataset.rok, "Aprobado", $(`[data-rceo="${b.dataset.rok}"]`)?.checked, $(`[data-rcom="${b.dataset.rok}"]`).value));
  $$("[data-rno]").forEach(b => b.onclick = () => revisarTicket(b, +b.dataset.rno, "Rechazado", false, $(`[data-rcom="${b.dataset.rno}"]`).value));

async function revisarTicket(btn, id, dec, ceo, com, alTerminar){
  com = (com||"").trim();
  if(dec==="Rechazado" && !com) return toast("Escribe el motivo del rechazo", true);
  const destino = dec==="Rechazado" ? "Se cerrará y se avisará al solicitante." : ceo ? `Pasará a ${aprobTitulo()}.` : "Pasará a la cola del encargado de Pricing.";
  if(!confirm(`¿${dec==="Aprobado"?"Aprobar":"Rechazar"} esta solicitud? ${destino}`)) return;
  try{ await conBoton(btn, () => API.revisar(id, dec, ceo, com)); toast(dec==="Aprobado" ? (ceo ? `Enviada a ${aprobTitulo()}` : "Aprobada y enviada al encargado") : "Solicitud rechazada");
    if(alTerminar) await alTerminar(); else await refrescar(); }catch(e){ fallo(e); }
}

async function vUsuarios(){
  const us = S.usuarios.slice().sort((a,b) => (b.activo-a.activo) || (a.nombre||"").localeCompare(b.nombre||""));
  const optRol = sel => Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${sel===k?"selected":""}>${l}</option>`).join("");

  const dominioOk = e => doms.includes(lower(e).split("@")[1]);

    const nombre = $("#un").value.trim(), email = lower($("#ue").value), rolSel = $("#ur").value;
    if(!dominioOk(email)) return toast(`Solo correos @${doms.join(" o @")}`, true);
    const avisar = $("#uaviso").checked;
    try{ await conBoton($("#ubtn"), () => API.adminUsuario({accion:"crear", nombre, email, rol:rolSel}));
      let aviso = "";
      if(avisar){
        try{ await API.bienvenida(email); aviso = S.cfg.flow_url ? " · se le envió el correo de acceso" : " · aviso guardado (falta configurar el flujo de correo)"; }
        catch(e2){ aviso = " · no se pudo enviar el correo de acceso"; }
      }
      toast(`${nombre} ya puede entrar` + aviso); await recargar(); vUsuarios(); }catch(err){ fallo(err); } };
  $$("tr[data-id]").forEach(tr => {
    const id = tr.dataset.id, u = S.usuarios.find(x => x.id===id);

    $(".upin",tr) && ($(".upin",tr).onclick = async ev => {
      if(!confirm(`¿Restablecer el PIN de ${u.nombre||u.email} a 00000? Deberá cambiarlo al entrar.`)) return;
      try{ await conBoton(ev.currentTarget, () => API.resetPin(id)); toast(`PIN de ${u.nombre||u.email} restablecido a 00000`); }catch(e){ fallo(e); } });

      $(".sno",tr).onclick = async ev => { if(!confirm(`¿Descartar la solicitud de ${r.email}?`)) return;
        try{ await conBoton(ev.currentTarget, () => API.resolverAcceso(r.id, "Descartada")); vUsuarios(); }catch(e){ fallo(e); } }; });
  }catch(e){ console.warn(e); }
}

function modal(html, cls=""){
  $("#modal-root").innerHTML = `<div class="ov" id="ov"><div class="modal ${cls}">${html}</div></div>`;
  $("#ov").onmousedown = e => { if(e.target.id==="ov") cerrarModal(); };

}

/* ---------- Cerrar ticket (con tiempo de ejecución) ---------- */
function abrirCierre(id){
  const t = S.tickets.find(x => x.id===id); if(!t) return;
  if(t.aprob_estado==="Pendiente") return toast(`Hay una solicitud de ${aprobTitulo()} pendiente`, true);
  const previas = S.horas.filter(x => x.ticket_id===id).reduce((s,x)=>s+Number(x.horas),0);
  modal(`
    <div class="modal-h"><div><div class="code">${esc(t.codigo)}</div><h1>Cerrar ticket</h1><div class="muted small">${esc(t.titulo)}</div></div><button class="x">×</button></div>
    <form class="form" id="fcierre">
      <label class="f full">Resultado<select id="cres"><option>Completado</option><option>Rechazado</option><option>Cancelado</option></select></label>
      <div class="full"><div class="f" style="margin-bottom:4px">Tiempo de ejecución${previas?` <span class="muted" style="font-weight:500">(adicional a ${fHoras(previas)} ya registradas)</span>`:""}</div>
        <div class="row" style="flex-wrap:nowrap"><label class="f grow">Horas<input type="number" id="ch" min="0" step="1" value="" required></label>
        <label class="f grow">Minutos<select id="cm">${[0,15,30,45].map(m=>`<option value="${m}">${m}</option>`).join("")}</select></label></div></div>
      <label class="f full">Resolución (le llega al solicitante)<textarea id="ctxt" rows="4" required placeholder="Qué se resolvió, precios o condiciones aprobadas, vigencia…"></textarea></label>
      <div class="full hint">Se notificará a ${esc(nombreDe(t.solicitante_email))} por la app${S.cfg.flow_url?" y por correo":""}.</div>
      <div class="full row" style="justify-content:flex-end"><button type="button" class="btn" id="ccancel">Cancelar</button><button class="btn pri" type="submit" id="cbtn">Cerrar y notificar</button></div>
    </form>`, "narrow");
  $("#ccancel").onclick = () => abrirDetalle(id);
  $("#ch").focus();
  $("#fcierre").onsubmit = async e => {
    e.preventDefault();
    const horas = (+$("#ch").value||0) + (+$("#cm").value||0)/60;
    if(horas <= 0 && $("#cres").value==="Completado") return toast("Registra el tiempo de ejecución", true);
    try{ await conBoton($("#cbtn"), () => API.cerrar(id, $("#cres").value, Math.round(horas*100)/100, $("#ctxt").value.trim()));
      toast(`${t.codigo} cerrado · ${fHoras(horas)}`); cerrarModal(); await refrescar(); }catch(err){ fallo(err); }
  };
}

/* ---------- Detalle del ticket ---------- */
async function abrirDetalle(id){
  let t = S.tickets.find(x => x.id===id);
  if(!t) return toast("Ticket no encontrado", true);
  modal(`<div class="empty"><span class="spin"></span> Cargando…</div>`, "wide");
  let bit = [], adj = [];
  try{ [bit, adj] = await Promise.all([API.bitacora(id), API.adjuntos(id)]); }catch(e){ fallo(e); }
  const st = staff() || lower(t.asignado_email)===S.me.email, cerrado = esCerrado(t), a = alertaDe(t), ap = S.cfg.aprobacion;
  const editSol = !st && solicitantePuedeEditar(t);
  const v = (k, d="—") => t[k]==null || t[k]==="" ? d : t[k];
  const pos = colaGlobal().findIndex(x => x.id===id) + 1;

  let campos;
  if((st && !cerrado) || editSol){
    const estOK = ABIERTOS_EDIT.includes(t.estado);
    campos = `<form class="form" id="fedit">
      ${st ? `<label class="f">Estado<select id="e_estado" ${estOK?"":"disabled"}>${(estOK?ABIERTOS_EDIT:[t.estado]).map(x=>`<option ${t.estado===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="f">Prioridad<select id="e_prioridad">${PRIORIDADES.map(x=>`<option ${t.prioridad===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="f">Asignado a<select id="e_asignado_email">${opcionesAtienden(t.asignado_email)}</select></label>
      <label class="f">Fecha estimada de entrega (ETA)<input type="date" id="e_fecha_eta" value="${v("fecha_eta","")}" ${enCola(t)?"":"disabled title='Se define cuando la solicitud llega a la cola de Pricing'"}></label>` : ""}
      <label class="f">Tipo<select id="e_tipo">${[...new Set([t.tipo, ...tiposActivos()])].map(x=>`<option ${t.tipo===x?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
      ${camposHTML(t.tipo, t.datos, "ec")}
      <label class="f full">Título<input type="text" id="e_titulo" value="${esc(t.titulo)}"></label>
      <label class="f full">Descripción<textarea id="e_descripcion" rows="4">${esc(v("descripcion",""))}</textarea></label>
      <div class="full row" style="justify-content:flex-end"><button class="btn pri" type="submit">Guardar cambios</button></div>
    </form>`;
  } else {
    campos = `<dl class="kv">
      <dt>Prioridad</dt><dd>${tagPrio(t.prioridad)}</dd><dt>Asignado a</dt><dd>${esc(t.asignado_email?nombreDe(t.asignado_email):"Equipo de Pricing")}</dd>
      <dt>Fecha estimada (ETA)</dt><dd>${t.fecha_eta ? fFecha(t.fecha_eta) + (staff() && alertaDe(t)==="Atrasada" ? ` <span class="tag t-brick">Atrasada ${diasAtraso(t)} d</span>` : "") : (enCola(t) ? "Pricing aún no la define" : "Se define cuando llegue a la cola de Pricing")}</dd>
      ${detalleKV(t)}</dl>
      ${t.descripcion ? `<h3 style="margin-top:12px">Descripción</h3><div class="desc">${esc(t.descripcion)}</div>` : ""}`;
  }

  // Acciones del equipo de Pricing
  let acciones = "";
  if(st && !cerrado){
    acciones = `<div class="actions" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
      ${puedeCerrar(t) ? `<button class="btn pri" id="a_cerrar" ${t.aprob_estado==="Pendiente"?"disabled title='Hay una aprobación pendiente'":""}>Cerrar ticket…</button>` : ""}
      ${puedeCerrar(t) ? `<button class="btn" id="a_devolver" title="Por ejemplo, si requiere ${esc(aprobTitulo())}: el manager la revisa de nuevo y decide">Devolver al manager…</button>` : ""}
      ${!enCola(t) ? `<span class="hint">${t.estado==="Revisión manager" ? "Esperando la revisión del manager." : `Esperando ${esc(aprobTitulo())}.`} El encargado podrá trabajarla cuando pase a la cola.</span>` : ""}</div>`;
  } else if(st && cerrado && staff()){
    acciones = `<div class="actions" style="margin-top:12px"><button class="btn" id="a_reabrir">Reabrir ticket</button></div>`;
  }

  if(!cerrado && (esMio(t) || rol()==="admin")){
    acciones += `<div class="actions" style="margin-top:12px"><button class="btn ghost" id="a_cancelar" style="color:var(--brick);border-color:var(--brick)">Cancelar solicitud</button></div>`;
  }

  // Bloque de cierre
  const cierre = cerrado ? `<div class="box ${t.estado==="Completado"?"ok":t.estado==="Rechazado"?"no":""}"><h3>${esc(t.estado)}</h3>
    <div class="small">Por <b>${esc(nombreDe(t.cerrado_por))}</b> el ${fFechaHora(t.cerrado_at)} · ${diasEntre(t.created_at, t.cerrado_at)} días${t.horas_ejecucion!=null?` · tiempo de ejecución <b>${fHoras(t.horas_ejecucion)}</b>`:""}</div>
    ${t.resolucion?`<div class="desc" style="margin-top:8px">${esc(t.resolucion)}</div>`:""}</div>` : "";

  // Posición en la cola (para el solicitante)
  const colaBox = !cerrado && !st && pos ? (() => { const c = S.cola.find(x => x.ticket_id===id); return c ? `<div class="box ok"><h3>Tu lugar en la cola: #${c.posicion} de ${c.total}</h3>
    <div class="small">${c.adelante===0?"Es la siguiente en atención.":`Hay ${c.adelante} solicitud${c.adelante>1?"es":""} antes de la tuya.`}</div>${pista(c)}${pasos(t)}</div>` : ""; })() : "";

  // Revisión del manager
  let revision = "";
  if(esRevisorDe(t)){
    revision = `<div class="box ap"><h3>Tu revisión como manager</h3>
      ${t.manager_comentario?`<div class="banner" style="margin:0 0 8px">${esc(t.manager_comentario)}</div>`:""}
      <label class="f">Comentario (obligatorio si rechazas)<textarea id="rv_com" rows="3"></textarea></label>
      ${ap.email ? `<label class="check" style="margin-top:8px"><input type="checkbox" id="rv_ceo"> Requiere ${esc(ap.titulo)}${ap.nombre?` (${esc(ap.nombre)})`:""}</label>` : ""}
      <div class="actions" style="margin-top:10px"><button class="btn pri" id="rv_ok">Aprobar</button><button class="btn danger" id="rv_no">Rechazar</button></div></div>`;
  } else if(t.manager_estado==="Pendiente"){
    revision = `<div class="box ap"><h3>En revisión del manager</h3><div class="small">Con <b>${esc(nombreDe(t.manager_email))}</b>${t.manager_comentario?"":` desde ${fFechaHora(t.created_at)}`}</div>${t.manager_comentario && staff()?`<div class="desc" style="margin-top:8px">${esc(t.manager_comentario)}</div>`:""}</div>`;
  } else if(["Aprobado","Rechazado"].includes(t.manager_estado)){
    revision = `<div class="box ${t.manager_estado==="Aprobado"?"ok":"no"}"><h3>Manager: ${esc(t.manager_estado.toLowerCase())}</h3>
      <div class="small">Por <b>${esc(nombreDe(t.manager_resuelto_por))}</b> el ${fFechaHora(t.manager_resuelto_at)}${t.manager_estado==="Aprobado"?(t.requiere_aprobacion?` · envió a ${esc(aprobTitulo())}`:" · directo al encargado"):""}</div>
      ${t.manager_comentario?`<div class="desc" style="margin-top:8px">${esc(t.manager_comentario)}</div>`:""}</div>`;
  }

  // Aprobación
  let aprob = "";
  if(esAprobadorDe(t)){
    aprob = `<div class="box ap"><h3>Tu decisión · ${esc(ap.titulo)}</h3><p class="small" style="margin-top:0">Enviado ${fFechaHora(t.aprob_enviado_at)}</p>
      <label class="f">Comentario (obligatorio si rechazas)<textarea id="ap_com" rows="3"></textarea></label>
      <div class="actions" style="margin-top:10px"><button class="btn pri" id="ap_ok">Aprobar</button><button class="btn danger" id="ap_no">Rechazar</button></div></div>`;
  } else if(t.aprob_estado==="Pendiente"){
    aprob = `<div class="box ap"><h3>${esc(ap.titulo)} pendiente</h3><div class="small">Con <b>${esc(nombreDe(t.aprob_email))}</b> desde ${fFechaHora(t.aprob_enviado_at)}</div></div>`;
  } else if(["Aprobado","Rechazado"].includes(t.aprob_estado)){
    aprob = `<div class="box ${t.aprob_estado==="Aprobado"?"ok":"no"}"><h3>${esc(ap.titulo)}: ${esc(t.aprob_estado.toLowerCase())}</h3>
      <div class="small">Por <b>${esc(nombreDe(t.aprob_resuelto_por))}</b> el ${fFechaHora(t.aprob_resuelto_at)}</div>
      ${t.aprob_comentario?`<div class="desc" style="margin-top:8px">${esc(t.aprob_comentario)}</div>`:""}</div>`;
  }

  modal(`
    <div class="modal-h">
      <div><div class="row" style="gap:8px"><span class="code" style="font-size:16px">${esc(t.codigo)}</span>${tagEstado(t.estado)}${tagAprob(t)}${tagAlerta(a)}${tagPrueba(t)}${!cerrado&&st&&pos?`<span class="tag t-slate">#${pos} en cola</span>`:""}</div>
        <h1 style="margin-top:6px">${esc(t.titulo)}</h1>
        <div class="muted small">${esc(tipoTxt(t))} · Solicitado por ${esc(nombreDe(t.solicitante_email))} el ${fFecha(t.created_at)}</div></div>
      <button class="x">×</button>
    </div>
    ${t.estado==="En espera de información" && esMio(t) ? `<div class="banner">Pricing necesita información para continuar. Responde en los comentarios.</div>` : ""}
    <div class="det">
      <div class="grid" style="gap:14px;align-content:start">
        ${cierre}${colaBox}
        <div class="card flat">${campos}${acciones}</div>
        <div class="card flat"><h3>Archivos</h3>
          <div>${adj.length ? adj.map(x=>`<div class="row small" style="padding:4px 0"><a href="#" data-ruta="${esc(x.ruta)}">📎 ${esc(x.nombre)}</a><span class="muted">${esc(nombreDe(x.subido_por))} · ${fFecha(x.created_at)}</span></div>`).join("") : `<div class="muted small">Sin archivos.</div>`}</div>
          <label class="btn sm" style="margin-top:8px">Adjuntar archivo<input type="file" id="adj_in" class="hidden" multiple></label></div>
      </div>
      <div class="grid" style="gap:14px;align-content:start">
        ${revision}${aprob}
        <div class="card flat"><h3>Comentarios y bitácora</h3>
          <textarea id="com" rows="2" placeholder="Escribe un comentario…"></textarea>
          <div class="row" style="justify-content:flex-end;margin:8px 0 6px"><button class="btn sm pri" id="com_btn">Comentar</button></div>
          <div class="tl">${bit.slice().reverse().map(evento).join("") || `<div class="muted small">Sin movimientos.</div>`}</div></div>
      </div>
    </div>`, "wide");

  const recargarDetalle = async () => { await recargar(); pintarApp(true); abrirDetalle(id); };

  $("#fedit") && ($("#fedit").onsubmit = async e => {
    e.preventDefault(); const c = {};
    try{ const d = leerCampos(t.tipo, "ec", t.datos||{}); if(JSON.stringify(d)!==JSON.stringify(t.datos||{})) c.datos = d; }catch(err){ return toast(err.message, true); }
    for(const k of ["estado","prioridad","asignado_email","fecha_eta","tipo","titulo","descripcion"]){
      const el = $("#e_"+k); if(!el || el.disabled) continue;
      let val = el.value.trim(); if(el.type==="number") val = val==="" ? null : Number(val); else if(val==="") val = null;
      const cur = t[k]==null || t[k]==="" ? null : (el.type==="number" ? Number(t[k]) : String(t[k]));
      if(val!==cur) c[k] = val;
    }
    if(!Object.keys(c).length) return toast("No hay cambios");
    if("titulo" in c && !c.titulo) return toast("El título no puede quedar vacío", true);
    try{ await API.actualizar(id, c); toast("Cambios guardados"); await recargarDetalle(); }catch(err){ fallo(err); }
  });
  $("#a_cerrar") && ($("#a_cerrar").onclick = () => abrirCierre(id));
  $("#a_cancelar") && ($("#a_cancelar").onclick = async ev => {
    const m = prompt(`¿Cancelar ${t.codigo}? Puedes indicar el motivo (opcional):`, ""); if(m===null) return;
    try{ await conBoton(ev.currentTarget, () => API.cancelar(id, m)); toast(`${t.codigo} cancelada`); await recargarDetalle(); }catch(e){ fallo(e); } });
  $("#a_reabrir") && ($("#a_reabrir").onclick = async () => { const m = prompt("Motivo para reabrir el ticket:"); if(!m) return;
    try{ await API.reabrir(id, m); toast("Ticket reabierto"); await recargarDetalle(); }catch(e){ fallo(e); } });
  $("#a_devolver") && ($("#a_devolver").onclick = async ev => {
    const m = prompt(`¿Devolver ${t.codigo} al manager? Sale de tu cola y vuelve a revisión.\nMotivo (obligatorio), por ejemplo: "Requiere ${aprobTitulo()}":`, ""); if(m===null) return;
    if(!m.trim()) return toast("Indica el motivo de la devolución", true);
    try{ await conBoton(ev.currentTarget, () => API.devolver(id, m)); toast(`${t.codigo} devuelta al manager`); await recargarDetalle(); }catch(e){ fallo(e); } });
  const decidir = async dec => { const com = $("#ap_com").value.trim();
    if(dec==="Rechazado" && !com) return toast("Escribe el motivo del rechazo", true);
    if(!confirm(`¿Confirmas que ${dec==="Aprobado"?"apruebas":"rechazas"} ${t.codigo}?`)) return;
    try{ await API.resolverAprob(id, dec, com); toast(`Solicitud ${dec==="Aprobado"?"aprobada":"rechazada"}`); await recargarDetalle(); }catch(e){ fallo(e); } };
  $("#ap_ok") && ($("#ap_ok").onclick = () => decidir("Aprobado"));
  $("#rv_ok") && ($("#rv_ok").onclick = ev => revisarTicket(ev.currentTarget, id, "Aprobado", $("#rv_ceo")?.checked, $("#rv_com").value, recargarDetalle));
  $("#rv_no") && ($("#rv_no").onclick = ev => revisarTicket(ev.currentTarget, id, "Rechazado", false, $("#rv_com").value, recargarDetalle));
  $("#ap_no") && ($("#ap_no").onclick = () => decidir("Rechazado"));
  $("#com_btn").onclick = async ev => { const txt = $("#com").value.trim(); if(!txt) return;
    try{ await conBoton(ev.currentTarget, () => API.nota(id, "Comentario", txt)); await recargarDetalle(); }catch(e){ fallo(e); } };
  $("#adj_in").onchange = async e => { try{ for(const f of e.target.files) await API.subir(id, f); toast("Archivo adjuntado"); await recargarDetalle(); }catch(err){ fallo(err); } };
  $$("[data-ruta]").forEach(el => el.onclick = async ev => { ev.preventDefault(); try{ window.open(await API.urlAdjunto(el.dataset.ruta), "_blank"); }catch(e){ fallo(e); } });
  // Marca como leídas las notificaciones de este ticket
  const ids = S.notifs.filter(n => n.ticket_id===id && !n.leida).map(n => n.id);
  if(ids.length){ API.marcarLeidas(ids).then(() => { S.notifs.forEach(n => { if(ids.includes(n.id)) n.leida = true; }); const b = $("#bell .bell-n"); if(b){ const k = noLeidas(); k ? b.textContent = k : b.remove(); } }).catch(()=>{}); }
}

function valorLegible(campo, v){
  if(v==null || v==="") return "vacío";
  if(campo==="requiere_aprobacion") return v==="true"||v===true ? "Sí" : "No";
  if(campo==="horas_ejecucion") return fHoras(v);
  if(/^fecha_/.test(campo)) return fFecha(v);
  if(/_email$/.test(campo)) return nombreDe(v);
  return v;
}
function evento(b){
  const quien = `<div class="who">${esc(nombreDe(b.usuario_email))} · ${fFechaHora(b.created_at)}</div>`;
  let cls = "", txt;
  switch(b.accion){
    case "Creación": cls="c"; txt = "Creó la solicitud"; break;
    case "Cambio": txt = `Cambió <b>${esc(CAMPOS[b.campo]||b.campo)}</b>: ${esc(valorLegible(b.campo,b.valor_anterior))} → <b>${esc(valorLegible(b.campo,b.valor_nuevo))}</b>`; break;
    case "Comentario": cls="c"; txt = "Comentó"; break;
    case "Solicitud de aprobación": cls="a"; txt = `Solicitó ${esc(aprobTitulo())} a <b>${esc(nombreDe(b.valor_nuevo))}</b>`; break;
    case "Revisión manager": cls = /^Aprobado/.test(b.valor_nuevo||"") ? "c" : "r"; txt = `Manager: <b>${esc(b.valor_nuevo)}</b>`; break;
    case "Decisión de aprobación": cls = b.valor_nuevo==="Aprobado" ? "c" : "r"; txt = `<b>${esc(b.valor_nuevo)}</b> · ${esc(aprobTitulo())}`; break;
    case "Cierre": cls="c"; txt = `Cerró el ticket: <b>${esc(b.valor_nuevo)}</b>`; break;
    case "Reapertura": cls="a"; txt = "Reabrió el ticket"; break;
    case "Cancelación": cls="r"; txt = "Canceló la solicitud"; break;
    case "Adjunto": txt = `Adjuntó <b>${esc(b.valor_nuevo)}</b>`; break;
    default: txt = esc(b.accion);
  }
  return `<div class="ev ${cls}"><span class="dt"></span><div>${quien}<div class="txt">${txt}</div>${b.comentario?`<div class="cm">${esc(b.comentario)}</div>`:""}</div></div>`;
}

iniciar();
</script>
</body>
</html>
